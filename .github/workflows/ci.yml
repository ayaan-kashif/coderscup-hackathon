name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # unit, golden and PGlite-backed integration tests (audit chain, RLS, idempotency, permissions)
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          DEMO_MODE: 'true'

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r ml/requirements.txt
      # the generator is deterministic: regenerating the JSON datasets must reproduce the committed files exactly
      - run: python ml/generate.py --seed 2026 --no-images --check
      - run: python ml/train.py --check

  e2e:
    # G1 checks against a real build: local Postgres (PGlite over the wire), migrations, seeds, Playwright
    runs-on: ubuntu-latest
    needs: web
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
      DB_POOL_MAX: '1'
      DB_FETCH_TYPES: 'false'
      DEMO_MODE: 'true'
      PORT: '3100'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Throwaway secrets for this run only
        run: |
          {
            echo "AUTH_JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "PII_ENC_KEY=$(openssl rand -base64 32 | tr -d '\n')"
            echo "PII_HMAC_PEPPER=$(openssl rand -hex 32)"
            echo "API_KEY_PEPPER=$(openssl rand -hex 32)"
            echo "DEMO_STAFF_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "DEMO_CITIZEN_PIN=$(shuf -i 1000-9999 -n 1)"
            echo "SHOPKEEPER_DEMO_PASSWORD=ci-shop-$(openssl rand -hex 12)"
          } >> "$GITHUB_ENV"
      - run: pnpm db:local &
      - run: npx wait-on tcp:127.0.0.1:54329 --timeout 60000
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm start &
      - run: npx wait-on http://127.0.0.1:3100/api/v1/health --timeout 60000
      - run: pnpm test:e2e
